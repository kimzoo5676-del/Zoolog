# main에 push → 테스트 → 이미지 빌드·GHCR 업로드 → deploy/k8s 이미지 태그 커밋 → Argo CD가 서버에 반영 (GitOps)
# 서버(Lightsail)는 빌드하지 않고 이미지를 받아 실행만 (CPU 크레딧 보호)
name: deploy

on:
  push:
    branches: [main]
    # 태그 커밋(deploy/k8s)과 문서만 바뀐 push는 다시 빌드하지 않음
    paths-ignore:
      - deploy/k8s/kustomization.yaml
      - "**.md"
  workflow_dispatch:

# 같은 브랜치 배포가 겹치면 앞선 실행을 취소 (태그 커밋 순서가 꼬이지 않도록)
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/zoolog-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/zoolog-web

jobs:
  backend:
    runs-on: ubuntu-latest
    # 테스트가 개발 DB·저장소를 쓰는 구조라 CI에서는 서비스 컨테이너로 같은 구성을 띄움 (테스트용 가짜 비밀값)
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: zoolog
          POSTGRES_USER: zoolog
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoolog -d zoolog"
          --health-interval 5s --health-timeout 5s --health-retries 10
      seaweedfs:
        image: chrislusf/seaweedfs:4.45
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
        ports: ["8333:8333"]
    env:
      DB_HOST: localhost
      POSTGRES_DB: zoolog
      POSTGRES_USER: zoolog
      POSTGRES_PASSWORD: ci-password
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: zoolog
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      # 서버 시작 시 저장소 버킷을 확인하므로 SeaweedFS S3가 응답할 때까지 기다림
      - name: SeaweedFS 준비 대기
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8333 && exit 0
            sleep 2
          done
          echo "SeaweedFS가 응답하지 않음" && exit 1
      - name: 테스트
        run: ./gradlew test
      - name: 실행용 jar 빌드
        run: ./gradlew bootJar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 이미지 태그 커밋
      packages: write # GHCR 업로드
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: backend-jar
          path: backend/build/libs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lightsail은 x86_64라 linux/amd64로 빌드
      - name: 백엔드 이미지
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: 화면 이미지 (React 빌드 + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # GitOps: 클러스터에 직접 배포하지 않고, 원하는 상태(이미지 태그)를 Git에 기록 → Argo CD가 맞춤
      - name: 이미지 태그 커밋
        run: |
          yq -i '(.images[] | select(.name == "zoolog-backend")).newName = strenv(BACKEND_IMAGE)' deploy/k8s/kustomization.yaml
          yq -i '(.images[] | select(.name == "zoolog-backend")).newTag = strenv(GITHUB_SHA)' deploy/k8s/kustomization.yaml
          yq -i '(.images[] | select(.name == "zoolog-web")).newName = strenv(WEB_IMAGE)' deploy/k8s/kustomization.yaml
          yq -i '(.images[] | select(.name == "zoolog-web")).newTag = strenv(GITHUB_SHA)' deploy/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore: 이미지 태그 ${GITHUB_SHA::7} 배포"
          git push
