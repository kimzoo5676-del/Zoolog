spring:
  application:
    name: zoolog
  datasource:
    # 개발: devcontainer의 db, 운영(k3s): postgres 서비스, CI: localhost
    url: jdbc:postgresql://${DB_HOST:db}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  servlet:
    multipart:
      # 이미지 원본 크기 제한 (2026-10-12 결정), 넘으면 413
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    # 오류 응답을 RFC 9457 ProblemDetail(JSON)로. ResponseStatusException의 이유가 detail에 담김
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # 알림 메일: Gmail SMTP 587 + STARTTLS (Lightsail은 25번만 막힘)
  # 비밀번호는 Google 계정 "앱 비밀번호"(2단계 인증 필요). 개발·테스트는 비워 둠 (발송은 운영 프로필에서만 켜짐)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email

zoolog:
  owner-email: ${OWNER_EMAIL}
  # 일정의 "오늘" 기준 시간대
  zone: Asia/Seoul
  # 이미지 저장소 (SeaweedFS S3 API, 컨테이너 안 주소). 외부 공개 금지
  storage:
    endpoint: ${S3_ENDPOINT:http://storage:8333}
    bucket: ${S3_BUCKET}
  # 매일 정해진 시각 알림 메일 (받는 사람: owner-email, 시각: zone 기준)
  # 운영(prod)에서만 켬: 개발 컨테이너에서 bootRun 중일 때 같은 메일이 두 번 오지 않도록
  reminders:
    enabled: false
    items:
      - cron: "0 0 7 * * *"
        subject: AWS-SAA 공부 시간입니다
      - cron: "0 0 18 * * *"
        subject: 영어 공부 시간입니다
