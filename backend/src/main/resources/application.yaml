spring:
  application:
    name: zoolog
  datasource:
    # 개발: devcontainer의 db, 운영(k3s): postgres 서비스, CI: localhost
    url: jdbc:postgresql://${DB_HOST:db}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  servlet:
    multipart:
      # 이미지 원본 크기 제한 (2026-10-12 결정), 넘으면 413
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    # 오류 응답을 RFC 9457 ProblemDetail(JSON)로. ResponseStatusException의 이유가 detail에 담김
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # 알림 메일: Gmail SMTP 587 + STARTTLS (Lightsail은 25번만 막힘)
  # 비밀번호는 Google 계정 "앱 비밀번호"(2단계 인증 필요). 개발·테스트는 비워 둠 (발송은 운영 프로필에서만 켜짐)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email

zoolog:
  owner-email: ${OWNER_EMAIL}
  # 메일 속 링크의 사이트 주소 (개발: Vite 개발 서버, 운영: application-prod.yaml)
  site-url: ${SITE_URL:http://localhost:5173}
  # 시각 기준 시간대: Clock 빈(이미지 정리·기사 날짜), cron 작업(알림·기사·정리)
  zone: Asia/Seoul
  # 이미지 저장소 (SeaweedFS S3 API, 컨테이너 안 주소). 외부 공개 금지
  storage:
    endpoint: ${S3_ENDPOINT:http://storage:8333}
    bucket: ${S3_BUCKET}
  # 매일 정해진 시각 알림 메일 (받는 사람: owner-email, 시각: zone 기준)
  # 운영(prod)에서만 켬: 개발 컨테이너에서 bootRun 중일 때 같은 메일이 두 번 오지 않도록
  reminders:
    enabled: false
    items:
      - cron: "0 0 7 * * *"
        subject: AWS-SAA 공부 시간입니다
      - cron: "0 0 18 * * *"
        subject: 영어 공부 시간입니다
  # 매일 06:00 아침 기사 메일: 핫이슈 1개(Google 뉴스 주요 기사) + IT·취업 2개(네이버 뉴스 검색), 선정·소개는 Claude
  # 운영(prod)에서만 켬
  news:
    enabled: false
    cron: "0 0 6 * * *"
    model: claude-opus-5-5
    queries:
      - 클라우드
      - AWS
      - 개발자 채용
      - IT 기업 채용
      - 삼성전자
      - SK하이닉스
      - 네이버
      - 카카오
      - AI 데이터센터
  # 네이버 뉴스 검색 API: 네이버 클라우드 콘솔 > NAVER API HUB > Application 등록(뉴스 선택) > 인증 정보의 Client ID·Secret
  # 없으면 IT·취업 기사 생략
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  # Claude API 키 (console.anthropic.com). 없으면 목록 앞쪽 기사로 대신함
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
