spring:
  application:
    name: zoolog
  datasource:
    url: jdbc:postgresql://db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  servlet:
    multipart:
      # 이미지 원본 크기 제한 (2026-10-12 결정), 넘으면 413
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    # 오류 응답을 RFC 9457 ProblemDetail(JSON)로. ResponseStatusException의 이유가 detail에 담김
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email

zoolog:
  owner-email: ${OWNER_EMAIL}
  # 일정의 "오늘" 기준 시간대
  zone: Asia/Seoul
  # 이미지 저장소 (SeaweedFS S3 API, 컨테이너 안 주소). 외부 공개 금지
  storage:
    endpoint: ${S3_ENDPOINT:http://storage:8333}
    bucket: ${S3_BUCKET}
