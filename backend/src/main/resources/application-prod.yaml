# 운영(Lightsail k3s) 전용: SPRING_PROFILES_ACTIVE=prod
server:
  # Caddy가 붙이는 X-Forwarded-Proto·For로 https와 실제 접속 주소를 인식
  # (없으면 Google 로그인 콜백 주소가 http로 만들어지고, secure 쿠키가 동작하지 않음)
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
  # 배포로 파드가 바뀔 때 처리 중인 요청을 마치고 종료
  shutdown: graceful

zoolog:
  # Secret zoolog-env의 DOMAIN (Caddy 인증서와 같은 값)
  site-url: https://${DOMAIN}
  # 알림 메일 발송 (MAIL_USERNAME, MAIL_PASSWORD 필요)
  reminders:
    enabled: true
  # 아침 기사 메일 (NAVER_CLIENT_ID, NAVER_CLIENT_SECRET 필요, ANTHROPIC_API_KEY는 선택)
  news:
    enabled: true
