# DB 백업: 매일 03:00(한국 시간) pg_dump → 서버 디스크 /var/backups/zoolog, 14일 지난 파일 삭제
# 서버 디스크에 남기므로 Lightsail 자동 스냅샷에도 함께 담김
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18.6
              envFrom:
                - secretRef:
                    name: zoolog-env
              command:
                - sh
                - -c
                - |
                  set -eu
                  file="/backup/zoolog-$(date +%Y%m%d-%H%M).sql.gz"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$file"
                  find /backup -name 'zoolog-*.sql.gz' -mtime +14 -delete
                  echo "backup: $file"
              resources:
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              hostPath:
                path: /var/backups/zoolog
                type: DirectoryOrCreate
