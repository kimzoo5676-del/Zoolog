# Caddy(화면 파일 + HTTPS + API 전달): 외부 공개는 이것만 (80/443)
# k3s 기본 ServiceLB가 LoadBalancer 서비스를 서버의 80/443 포트에 연결
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
---
# 발급받은 인증서 보관 (재시작해도 다시 발급받지 않도록, Let's Encrypt 발급 횟수 제한 대비)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  # 무중단 배포: 새 파드를 먼저 띄워 준비되면 옛 파드를 내림 (배포 순간만 2개, 메모리 상한 128Mi라 부담 적음)
  # 인증서 PVC는 ReadWriteOnce(노드 단위)라 같은 서버의 두 파드가 함께 쓸 수 있고, Caddy는 저장소 잠금으로 공유를 지원
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: web
          image: zoolog-web
          env:
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: zoolog-env
                  key: DOMAIN
            - name: ACME_EMAIL
              valueFrom:
                secretKeyRef:
                  name: zoolog-env
                  key: ACME_EMAIL
          ports:
            - containerPort: 80
            - containerPort: 443
          # 443을 받을 수 있을 때만 요청을 보냄
          readinessProbe:
            tcpSocket:
              port: 443
            periodSeconds: 5
          # 종료 신호 전에 몇 초 기다려 서비스 목록에서 빠질 시간을 줌 (그사이 들어온 요청도 처리)
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
