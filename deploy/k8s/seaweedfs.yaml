# SeaweedFS(S3 API 8333): 이미지 저장소. 클러스터 안에서만 접근, 절대 외부 공개 금지
# 개발용 devcontainer와 같은 이미지·설정(접근 키는 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY)
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.45
          envFrom:
            - secretRef:
                name: zoolog-env
          ports:
            - containerPort: 8333
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
