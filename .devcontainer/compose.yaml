services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu26.04
    env_file: .env
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    volumes:
      - ..:/workspaces/zoolog:cached
      - claude-config:/home/vscode/.claude
    command: sleep infinity

  db:
    image: postgres:18
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql

  storage:
    image: chrislusf/seaweedfs:4.45
    env_file: .env
    volumes:
      - weeddata:/data

volumes:
  pgdata:
  weeddata:
  claude-config: